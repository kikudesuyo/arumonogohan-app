name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Check Go API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Format check
        working-directory: api
        run: make format-check
      - name: Vet
        working-directory: api
        run: make lint
      - name: Test
        working-directory: api
        run: go test -race ./...
      - name: Build
        working-directory: api
        run: make build
      - name: Docker build
        working-directory: api
        run: make docker-build
