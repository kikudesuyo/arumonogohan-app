name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-api-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    name: Deploy Go API to Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: arumonogohan-app
      REGION: asia-northeast1
      SERVICE: arumonogohan-api
      REPOSITORY: arumonogohan
      RUNTIME_SERVICE_ACCOUNT: arumonogohan-runtime@arumonogohan-app.iam.gserviceaccount.com
      GEMINI_API_KEY_SECRET: GEMINI_API_KEY
      LINE_CHANNEL_SECRET_SECRET: LINE_BOT_CHANNEL_SECRET
      LINE_CHANNEL_TOKEN_SECRET: LINE_BOT_CHANNEL_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Test and build Go API
        working-directory: api
        run: make test build
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/455901512974/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@arumonogohan-app.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        working-directory: api
        run: make deploy
