services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8081}:${PORT:-8081}"
    environment:
      PORT: ${PORT:-8081}
      GEMINI_PROJECT_ID: ${GEMINI_PROJECT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LINE_BOT_CHANNEL_SECRET: ${LINE_BOT_CHANNEL_SECRET:-}
      LINE_BOT_CHANNEL_TOKEN: ${LINE_BOT_CHANNEL_TOKEN:-}
